worker_processes auto;
events { worker_connections 4096; }

http {
  # Per-client rate limit (generous: a whole school may share one IP). Tune for your result day.
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
  limit_req_status 429;

  upstream result_api {
    least_conn;                                   # send each request to the least busy instance
    server result-1:5100 max_fails=3 fail_timeout=10s;
    server result-2:5100 max_fails=3 fail_timeout=10s;
    server result-3:5100 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80;
    server_tokens off;
    gzip on;
    gzip_types application/json;

    location /api/results/ {
      limit_req zone=per_ip burst=100 nodelay;
      proxy_pass http://result_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_next_upstream error timeout http_502 http_503;   # a dead instance is skipped transparently
      proxy_next_upstream_tries 2;
    }

    location = /health { proxy_pass http://result_api/health; access_log off; }
    location / { return 404; }
  }
}
